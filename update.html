<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>What's New | TabCycle</title>
    <link rel="stylesheet" href="assets/css/styles.css">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            font-size: 16px;
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        .version-badge {
            display: inline-block;
            background: linear-gradient(135deg, #004f9f, #7174f8);
            color: white;
            padding: 6px 12px;
            border-radius: 4px;
            font-size: 0.875rem;
            font-weight: 600;
            line-height: 1.5;
            margin-left: 10px;
        }
        .update-section {
            margin: 20px 0;
        }
        .update-section h3 {
            color: #007bff;
            font-size: 1.25rem;
            font-weight: 600;
            line-height: 1.3;
            margin-top: 20px;
            margin-bottom: 12px;
        }
        .update-section ul {
            margin: 12px 0;
            padding-left: 24px;
        }
        .update-section li {
            margin: 8px 0;
            font-size: 1rem;
            line-height: 1.6;
        }
        .button-container {
            text-align: center;
            margin-top: 30px;
        }
        button {
            background: #007bff;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.9375rem;
            font-weight: 500;
            line-height: 1.5;
            margin: 0 10px;
            font-family: inherit;
        }
        button:hover {
            background: #0056b3;
        }
        .close-button {
            background: #6c757d;
        }
        .close-button:hover {
            background: #5a6268;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>
            What's New in TabCycle
            <span class="version-badge" id="version-badge">v2.4.5</span>
        </h1>
        <section id="update-section">
            <div class="update-section">
                <h3>New Features</h3>
                <ul id="added-list">
                    <!-- Will be populated by update.js -->
                </ul>
            </div>
            <div class="update-section">
                <h3>Bug Fixes</h3>
                <ul id="fixed-list">
                    <!-- Will be populated by update.js -->
                </ul>
            </div>
            <div class="update-section">
                <h3>🔧 Improvements</h3>
                <ul id="changed-list">
                    <!-- Will be populated by update.js -->
                </ul>
            </div>
        </section>
        <div class="button-container">
            <button id="options-button">Open Settings</button>
            <button class="close-button" id="close-button">Close</button>
        </div>
    </div>
    <script src="assets/js/update.js"></script>
</body>
</html>
